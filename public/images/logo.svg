<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AIERA-TS">
  <!-- AIERA-TS mark: a network head in profile with a glowing gold circuit, on deep green (original artwork) -->
  <defs>
    <linearGradient id="aiera-forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164A30"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <radialGradient id="aiera-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5D36B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5D36B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#aiera-forest)"/>
  <!-- head outline, facing right -->
  <path d="M21 55 V47 C14.5 43 12 35 13 27.5 C14.5 17 22.5 10 32.5 10 C42.5 10 50 17 50.5 26 L54.5 33 L50.5 35 L51 40 C51 43.5 48 44.5 45 44.5 L44 51 L37 55"
        fill="none" stroke="#86C39D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- network mesh inside the head -->
  <g stroke="#86C39D" stroke-width="1" stroke-linecap="round" opacity="0.55">
    <path d="M17 34 L21 21 L29 14 L40 14 L47 21"/>
    <path d="M17 34 L24 41 L34 45 L44 40 L48 31"/>
    <path d="M21 21 L24 41"/><path d="M40 14 L48 31"/><path d="M24 41 L44 40"/>
  </g>
  <g fill="#86C39D">
    <circle cx="17" cy="34" r="1.5"/><circle cx="21" cy="21" r="1.5"/><circle cx="29" cy="14" r="1.5"/><circle cx="40" cy="14" r="1.5"/>
    <circle cx="47" cy="21" r="1.5"/><circle cx="48" cy="31" r="1.5"/><circle cx="44" cy="40" r="1.5"/><circle cx="34" cy="45" r="1.5"/><circle cx="24" cy="41" r="1.5"/>
  </g>
  <!-- glowing gold circuit -->
  <circle cx="32" cy="28" r="14" fill="url(#aiera-glow)"/>
  <circle cx="32" cy="28" r="7.5" fill="none" stroke="#F5D36B" stroke-width="2.2" stroke-dasharray="9 2.8"/>
  <circle cx="32" cy="28" r="3" fill="#F5D36B"/>
  <g stroke="#F5D36B" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M39.5 28 H44 L48 31"/><path d="M27 22.5 L21 21"/><path d="M29 35 L24 41"/>
  </g>
  <g fill="#F5D36B"><circle cx="48" cy="31" r="1.9"/><circle cx="21" cy="21" r="1.9"/><circle cx="24" cy="41" r="1.9"/></g>
</svg>
