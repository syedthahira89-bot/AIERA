# Netlify reads this automatically when you import the repo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Browsers and crawlers request these legacy icon paths by default; serve the PNG icons instead of a 404
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

# Old topic addresses, renamed in November 2026
[[redirects]]
  from = "/topics/llms/*"
  to = "/topics/talking-machines/"
  status = 301

[[redirects]]
  from = "/topics/computer-vision/*"
  to = "/topics/eyes-of-ai/"
  status = 301

[[redirects]]
  from = "/topics/reinforcement-learning/*"
  to = "/topics/learning-by-trying/"
  status = 301

[[redirects]]
  from = "/topics/math-foundations/*"
  to = "/topics/numbers-behind-the-magic/"
  status = 301

[[redirects]]
  from = "/topics/training/*"
  to = "/topics/how-ai-learns/"
  status = 301

[[redirects]]
  from = "/topics/mlops/*"
  to = "/topics/from-lab-to-life/"
  status = 301

[[redirects]]
  from = "/topics/ai-in-everyday-life/*"
  to = "/topics/ai-and-you/"
  status = 301

# Serve Astro's custom 404 page for unknown URLs
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
