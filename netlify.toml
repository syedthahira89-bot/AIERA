# Netlify reads this automatically when you import the repo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Browsers and crawlers request these legacy icon paths by default; serve the PNG icons instead of a 404
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

# Old topic addresses (renamed in 2026), sent straight to the current topic
[[redirects]]
  from = "/topics/llms/*"
  to = "/topics/llms-decoded/"
  status = 301

