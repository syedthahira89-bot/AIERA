# Netlify reads this automatically when you import the repo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Old topic pages, merged into "Training & deployment" (permanent redirects so links and search results keep working)
[[redirects]]
  from = "/topics/math-foundations/"
  to = "/topics/training-and-deployment/"
  status = 301

[[redirects]]
  from = "/topics/training/"
  to = "/topics/training-and-deployment/"
  status = 301

[[redirects]]
  from = "/topics/reinforcement-learning/"
  to = "/topics/training-and-deployment/"
  status = 301

[[redirects]]
  from = "/topics/mlops/"
  to = "/topics/training-and-deployment/"
  status = 301
# Browsers and crawlers request these legacy icon paths by default; serve the PNG icons instead of a 404
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

# Serve Astro's custom 404 page for unknown URLs
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
